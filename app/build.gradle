plugins { id 'com.android.application' }

android {
    namespace 'com.xarkon.pingtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xarkon.pingtest'
        minSdk 26
        targetSdk 35
        versionCode 64
        versionName '1.5.56'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
