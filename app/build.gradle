// v1.5.79: avoid falsely labeling unknown per-app routes as direct.
plugins { id 'com.android.application' }

android {
    namespace 'com.xarkon.pingtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xarkon.pingtest'
        minSdk 26
        targetSdk 35
        versionCode 115
        versionName '1.5.107'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}
